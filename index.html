<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Dev Simulator</title>
<style>
  body { background: #121212; color: #00D395; font-family: monospace; padding: 20px; max-width: 500px; margin: auto; }
  .box { border: 1px solid #0052FF; padding: 15px; background: #1e1e1e; border-radius: 8px; }
  button { background: #0052FF; color: #fff; border: none; padding: 8px 12px; margin: 5px; cursor: pointer; border-radius: 4px; }
</style>
</head>
<body>
<h1>Base Builder Tycoon</h1>
<div class="box">
  <p>Пользователи: <span id="u">0</span></p>
  <p>Капитал: $<span id="m">100</span></p>
  <hr>
  <p id="log">Добро пожаловать в экосистему Base! Начни разработку своего dApp.</p>
  <button onclick="act('code')">Оптимизировать газ (-$20, +Пользователи)</button>
  <button onclick="act('grant')">Подать заявку на грант (+$100)</button>
  <button onclick="act('ad')">Запустить мем-кампанию (-$50, ++Пользователи)</button>
</div>
<script>
  let u = 0, m = 100;
  function update() { document.getElementById('u').innerText = u; document.getElementById('m').innerText = m; }
  function act(type) {
    if(type==='code' && m>=20) { m-=20; u+=15; document.getElementById('log').innerText = "Контракт оптимизирован! Комиссии упали."; }
    else if(type==='grant') { m+=100; document.getElementById('log').innerText = "Вы получили грант от фонда Base!"; }
    else if(type==='ad' && m>=50) { m-=50; u+=60; document.getElementById('log').innerText = "Твит вирально разошелся в крипто-твиттере!"; }
    else { document.getElementById('log').innerText = "Не хватает денег!"; }
    update();
  }
</script>
</body>
</html>
